<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Game Store — Sign In</title>
    <link rel="stylesheet" href="../css/contant.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/logo.svg">
</head>
<body>

    <!-- Animated background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>

    <!-- Floating tiles -->
    <div class="float-tile ft-1" style="color:rgba(224,32,32,0.35)">7</div>
    <div class="float-tile ft-2" style="color:rgba(21,80,212,0.35)">3</div>
    <div class="float-tile ft-3" style="color:rgba(224,120,32,0.35)">11</div>
    <div class="float-tile ft-4" style="color:rgba(26,26,26,0.25)">5</div>

    <!-- Two-panel layout -->
    <div class="page-wrap">

        <!-- Left panel — branding -->
        <div class="brand-panel">
            <img src="../images/logo.svg" alt="Rummikub Game Store" class="brand-logo">
            <h2 class="brand-headline">Your Game.<br>Your Move.</h2>
            <p class="brand-sub">Log in or create an account to access classic strategy games and compete against AI opponents.</p>
            <div class="brand-tiles">
                <div class="mini-tile" style="color:#e02020">7</div>
                <div class="mini-tile" style="color:#1550d4">3</div>
                <div class="mini-tile" style="color:#e07820">11</div>
                <div class="mini-tile" style="color:#1a1a1a">5</div>
            </div>
        </div>

        <!-- Right panel — forms -->
        <div class="form-panel">

            <div id="loginModal" class="auth-card">
                <h2>Welcome Back</h2>
                <p class="form-sub">Sign in to continue playing</p>
                <form id="loginForm">
                    <div class="field">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" placeholder="Email address" required>
                    </div>
                    <div class="field">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        Log In <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <div class="switch-form">
                    Don't have an account?
                    <a onclick="switchToSignup()">Sign Up</a>
                </div>
            </div>

            <div id="signupModal" class="auth-card" style="display:none">
                <h2>Create Account</h2>
                <p class="form-sub">Join the game store today</p>
                <form id="signupForm">
                    <div class="field">
                        <i class="fa-regular fa-user field-icon"></i>
                        <input type="text" placeholder="Username" required>
                    </div>
                    <div class="field">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" placeholder="Email address" required>
                    </div>
                    <div class="field">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="field">
                        <i class="fa-solid fa-shield-halved field-icon"></i>
                        <input type="password" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        Create Account <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <div class="switch-form">
                    Already registered?
                    <a onclick="switchToLogin()">Log In</a>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/contant.js"></script>
</body>
</html>
